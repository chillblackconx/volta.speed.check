<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volta Speed Index - L'énergie de votre présence en ligne</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script>
        // MARQUEUR DE DÉPART pour la mesure de performance (cachée)
        window.performance.mark('voltaStart');
    </script>
    
    <header>
        <div class="logo">VOLTA TECH</div>
    </header>

    <main class="hero">
        <div class="kinetic-bg"></div>
        <div class="content">
            <h1>Volta Speed Index</h1>
            <p class="subtitle">L'énergie de votre présence en ligne. Lancez le diagnostic.</p>

            <div class="input-container">
                <input type="url" id="urlInput" placeholder="Entrez l'URL du site (ex: https://monsite.com)" required>
                <button id="analyzeButton">⚡ ANALYSER LA VITESSE</button>
            </div>

            <p class="small-print">Analyse basée sur les critères de performance web modernes (Core Web Vitals).</p>

            <div id="loadingIndicator" class="hidden">
                <div class="loader"></div>
                <p>Analyse en cours... Veuillez patienter quelques instants.</p>
            </div>
        </div>
    </main>

    <footer>
        &copy; 2025 Volta Tech - Studio de Création Web
    </footer>

    <script src="script.js"></script>
</body>
</html>
